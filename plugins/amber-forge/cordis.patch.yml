# Amber Forge 琥珀圣炉 — bundle patch: inserts the dual-face plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add link:<repo>/amber-forge`.
- insert:
    - id: amber-forge
      name: 'amber-forge'
