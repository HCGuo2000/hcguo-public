# Amber Forge 琥珀圣炉 — bundle patch.
#
# Inserts the plugin row into whichever profile lists this package in its
# `dsh.profile.bundles`. The row is the host half (lib/index.js); the skin
# itself is the client half served from exports["./client"].
#
# Install into a profile with:
#   dsh plugin add https://github.com/HCGuo2000/hcguo-public/tree/main/plugins/amber-forge
- insert:
    - id: amber-forge
      name: 'amber-forge'
